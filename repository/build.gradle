plugins {
    id 'org.jetbrains.kotlin.jvm'
}

group = 'pt.isel.daw'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    implementation(project(":domain"))
    implementation("org.jetbrains.kotlinx:kotlinx-datetime:0.4.1")
}

test {
    useJUnitPlatform()
}
kotlin {
    jvmToolchain(21)
}