services:
  # Just a machine running ubuntu, with 'dig' installed so that we can observe the docker compose environment.
  ubuntu:
    container_name: pokerdice-ubuntu # Mudei o nome para evitar conflitos com outros projetos
    build:
      context: .
      dockerfile: ./docker/Dockerfile-ubuntu
    tty: true
  # --- Database ---
  db-dev:
    container_name: db-pokerdice-dev
    hostname: db-pokerdice-dev
    image: pokerdice-db-dev
    build:
      context: .
      dockerfile: ./docker/Dockerfile-db-dev
    environment:
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=changeit
      - POSTGRES_DB=poker
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dbuser -d poker" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Backend 1 (8081 - Load Balanced) ---
  backend-1:
    container_name: pokerdice-backend-1
    hostname: pokerdice-backend-1
    build:
      context: .
      dockerfile: ./docker/Dockerfile-jvm
    environment:
      - SERVER_PORT=8081
      - DB_URL=jdbc:postgresql://db-pokerdice-dev:5432/poker?user=dbuser&password=changeit
    ports:
      - "8081:8081"
    depends_on:
      db-dev:
        condition: service_healthy

  # --- Backend 2 (8082 - Load Balanced) ---
  backend-2:
    container_name: pokerdice-backend-2
    hostname: pokerdice-backend-2
    build:
      context: .
      dockerfile: ./docker/Dockerfile-jvm
    environment:
      - SERVER_PORT=8082
      - DB_URL=jdbc:postgresql://db-pokerdice-dev:5432/poker?user=dbuser&password=changeit
    ports:
      - "8082:8082"
    depends_on:
      db-dev:
        condition: service_healthy

  # --- Nginx (Frontend + Load Balancer) ---
  nginx:
    container_name: pokerdice-nginx
    build:
      context: .
      dockerfile: ./docker/Dockerfile-nginx
    ports:
      - "8080:8080"
    depends_on:
      - backend-1
      - backend-2